<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, follow" />
  <meta name="theme-color" content="#f7f5ef" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#12110f" media="(prefers-color-scheme: dark)" />
  <title>Pagina niet gevonden — EasyCodey</title>
  <meta name="description" content="Deze pagina bestaat niet (meer). Ga terug naar EasyCodey en vind een Python-project." />
  <link rel="icon" href="/easycodey/assets/icons/icon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="/easycodey/assets/fonts/fonts.css" />
  <style>
    :root {
      color-scheme: light;
      --ivory: #f7f5ef;
      --ink: #1f2a24;
      --green: #1f4d3a;
      --gold: #b8862f;
      --muted: #5b665f;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: radial-gradient(circle at 50% 0%, #fffdf7, var(--ivory) 60%);
      color: var(--ink);
      font-family: "Plus Jakarta Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
      line-height: 1.6;
    }
    main {
      width: min(560px, 100%);
      text-align: center;
    }
    .code {
      margin: 0;
      font-family: "Fraunces", Georgia, "Times New Roman", serif;
      font-size: clamp(4.5rem, 18vw, 8rem);
      line-height: 1;
      color: var(--gold);
      letter-spacing: 0.02em;
    }
    h1 {
      margin: 8px 0 12px;
      font-family: "Fraunces", Georgia, "Times New Roman", serif;
      font-size: clamp(1.5rem, 5vw, 2.1rem);
      color: var(--green);
    }
    p { margin: 0 auto 22px; max-width: 44ch; color: var(--muted); }
    .actions { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; }
    a.button {
      display: inline-block;
      padding: 12px 20px;
      border-radius: 999px;
      text-decoration: none;
      font-weight: 700;
      background: var(--green);
      color: #fff;
      transition: transform 0.15s ease, background 0.15s ease;
    }
    a.button.secondary {
      background: transparent;
      color: var(--green);
      box-shadow: inset 0 0 0 2px var(--green);
    }
    a.button:hover { transform: translateY(-1px); }
    a.button.secondary:hover { background: rgba(31, 77, 58, 0.08); }
    footer { margin-top: 28px; font-size: 0.85rem; color: var(--muted); }
    @media (prefers-color-scheme: dark) {
      :root {
        color-scheme: dark;
        --ivory: #12110f;
        --ink: #f1eee6;
        --green: #8fcaa8;
        --gold: #e0b45f;
        --muted: #b8b2a6;
      }
      body { background: radial-gradient(circle at 50% 0%, #1c1a16, var(--ivory) 60%); }
      a.button { background: var(--green); color: #10130f; }
      a.button.secondary { color: var(--green); box-shadow: inset 0 0 0 2px var(--green); }
    }
    @media (prefers-reduced-motion: reduce) {
      a.button { transition: none; }
      a.button:hover { transform: none; }
    }
  </style>
</head>
<body>
  <main>
    <p class="code" aria-hidden="true">404</p>
    <h1>Deze pagina bestaat niet</h1>
    <p>
      Misschien is de link oud of staat er een typfout in het adres.
      Geen zorgen: je kunt gewoon verder leren.
    </p>
    <div class="actions">
      <a class="button" href="/easycodey/">Naar de startpagina</a>
      <a class="button secondary" href="/easycodey/projecten/">Bekijk alle projecten</a>
    </div>
    <footer>EasyCodey — leren door te bouwen</footer>
  </main>
</body>
</html>
